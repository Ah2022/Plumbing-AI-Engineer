<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title description">
  <title id="title">Plumbing AI Engineer: workflow and capabilities</title>
  <desc id="description">Six steps: define the project basis, choose an input, review engineering data, run a supported calculation, resolve findings, and save evidence for review. Capabilities cover plumbing calculations, network analysis, BIM mapping, drawing review and traceable reports. Engineering acceptance remains a separate gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d8393"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { fill: #102e43; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #486170; font-size: 16px; }
      .eyebrow { fill: #4b6675; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .step { fill: #17384c; font-size: 17px; font-weight: 700; }
      .body { fill: #455f70; font-size: 14px; }
      .number { fill: #ffffff; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .group { fill: #ffffff; font-size: 17px; font-weight: 700; }
      .capability { fill: #deebf2; font-size: 15px; }
      .connector { stroke: #5d8393; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="820" rx="18" fill="#f3f7fa"/>
  <rect x="32" y="30" width="5" height="58" rx="2" fill="#087f8c"/>
  <text class="title" x="52" y="55">How the engine works</text>
  <text class="subtitle" x="52" y="83">Plumbing AI Engineer · Reviewed inputs. Supported checks. Traceable results.</text>
  <text class="eyebrow" x="32" y="119">YOUR WORKFLOW</text>
  <text class="eyebrow" x="518" y="119">ENGINE CAPABILITIES</text>

  <g>
    <rect x="32" y="136" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="168" r="17" fill="#087f8c"/><text class="number" x="61" y="174">1</text>
    <text class="step" x="92" y="160">Define the project basis</text>
    <text class="body" x="92" y="183">Record the code edition, units, project criteria</text>
    <text class="body" x="92" y="203">and applicable source references.</text>
    <line class="connector" x1="61" y1="221" x2="61" y2="230"/>
  </g>
  <g>
    <rect x="32" y="232" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="264" r="17" fill="#087f8c"/><text class="number" x="61" y="270">2</text>
    <text class="step" x="92" y="256">Choose an input route</text>
    <text class="body" x="92" y="279">Use forms, fixture schedules, network tables,</text>
    <text class="body" x="92" y="299">mapped JSON, or model and drawing evidence.</text>
    <line class="connector" x1="61" y1="317" x2="61" y2="326"/>
  </g>
  <g>
    <rect x="32" y="328" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="360" r="17" fill="#087f8c"/><text class="number" x="61" y="366">3</text>
    <text class="step" x="92" y="352">Review the engineering data</text>
    <text class="body" x="92" y="375">Confirm service, bore, flow, elevations,</text>
    <text class="body" x="92" y="395">connectivity, reviewer and evidence.</text>
    <line class="connector" x1="61" y1="413" x2="61" y2="422"/>
  </g>
  <g>
    <rect x="32" y="424" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="456" r="17" fill="#087f8c"/><text class="number" x="61" y="462">4</text>
    <text class="step" x="92" y="448">Run a supported calculation</text>
    <text class="body" x="92" y="471">Use the selected method, tree evaluator,</text>
    <text class="body" x="92" y="491">or configured EPANET backend.</text>
    <line class="connector" x1="61" y1="509" x2="61" y2="518"/>
  </g>
  <g>
    <rect x="32" y="520" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="552" r="17" fill="#087f8c"/><text class="number" x="61" y="558">5</text>
    <text class="step" x="92" y="544">Resolve the findings</text>
    <text class="body" x="92" y="567">Inspect results, margins, warnings and data gaps.</text>
    <text class="body" x="92" y="587">Revise the inputs and rerun affected checks.</text>
    <line class="connector" x1="61" y1="605" x2="61" y2="614"/>
  </g>
  <g>
    <rect x="32" y="616" width="454" height="84" rx="10" fill="#ffffff" stroke="#d4e1e8"/>
    <circle cx="61" cy="648" r="17" fill="#087f8c"/><text class="number" x="61" y="654">6</text>
    <text class="step" x="92" y="640">Save evidence for review</text>
    <text class="body" x="92" y="663">Retain calculation records, revisions and exports.</text>
    <text class="body" x="92" y="683">Use guarded Revit handoffs where configured.</text>
  </g>

  <g>
    <rect x="518" y="136" width="450" height="172" rx="12" fill="#153b52"/>
    <rect x="518" y="136" width="5" height="172" rx="2" fill="#20b5b3"/>
    <text class="group" x="545" y="167">Plumbing calculations</text>
    <text class="capability" x="545" y="197">Water demand, fixture and pipe checks</text>
    <text class="capability" x="545" y="222">Drainage flow and supplied vent criteria</text>
    <text class="capability" x="545" y="247">Hot water, recirculation, heaters and storage</text>
    <text class="capability" x="545" y="272">Pump curves, storm storage and scoped screens</text>
  </g>
  <g>
    <rect x="518" y="332" width="450" height="172" rx="12" fill="#153b52"/>
    <rect x="518" y="332" width="5" height="172" rx="2" fill="#20b5b3"/>
    <text class="group" x="545" y="363">Network analysis</text>
    <text class="capability" x="545" y="393">Tree hydraulics and pressure margins</text>
    <text class="capability" x="545" y="418">Loops, pumps, tanks and valves via EPANET</text>
    <text class="capability" x="545" y="443">Demand scenarios and time simulations</text>
    <text class="capability" x="545" y="468">Method scope, solver diagnostics and traces</text>
  </g>
  <g>
    <rect x="518" y="528" width="450" height="172" rx="12" fill="#153b52"/>
    <rect x="518" y="528" width="5" height="172" rx="2" fill="#20b5b3"/>
    <text class="group" x="545" y="559">BIM, drawings and evidence</text>
    <text class="capability" x="545" y="589">IFC / Revit mapping and extraction snapshots</text>
    <text class="capability" x="545" y="614">Connectivity and model revision checks</text>
    <text class="capability" x="545" y="639">DXF, DWG conversion intake and PDF review</text>
    <text class="capability" x="545" y="664">Review packets and guarded Revit results</text>
  </g>
  <rect x="32" y="728" width="936" height="62" rx="10" fill="#e1f0ee"/>
  <text x="52" y="752" fill="#11615f" font-size="12" font-weight="700" letter-spacing="1.3">SEPARATE ENGINEERING REVIEW GATE</text>
  <text x="52" y="774" fill="#245851" font-size="14">A technical PASS does not establish code compliance or independent engineering acceptance.</text>
</svg>
