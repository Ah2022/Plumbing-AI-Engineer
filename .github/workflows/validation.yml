name: Review build validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-checkout:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audited dependencies
        run: python -m pip install -r requirements.txt -r requirements-models.txt
      - name: Regressions and known-defect reproductions
        run: python -m pytest tests/test_audit_benchmarks.py tests/test_bim_exchange.py tests/test_reports.py tests/test_runtime_safety.py tests/test_governance.py tests/test_governance_ui.py tests/test_foundations.py tests/test_networks.py tests/test_network_ui.py tests/test_fixture_schedules.py tests/test_workbooks.py tests/test_workbook_ui.py tests/test_interactive_packages.py -q
      - name: Public-checkout interface navigation
        run: python -m pytest tests/test_streamlit_app.py -k "project_page_loads or every_page_loads" -q
      - name: Review evidence, release benchmarks and guarded Revit handoff
        run: python -m pytest tests/test_review_workflow.py tests/test_revit_handoff.py tests/test_phase67_ui.py -q
      - name: Frozen engineering reference candidates and acceptance gates
        run: python -m pytest tests/test_engineering_validation.py -q
      - name: General graph routing, backend diagnostics and governed interface
        run: python -m pytest tests/test_general_solver.py tests/test_general_solver_ui.py -q
      - name: Scoped engineering methods, source gates and interactive pages
        run: python -m pytest tests/test_engineering_modules.py tests/test_engineering_modules_ui.py -q
      - name: BIM mappings, extraction contracts and round-trip safeguards
        run: python -m pytest tests/test_bim_mapping.py tests/test_bim_mapping_ui.py tests/test_bim_round_trip.py tests/test_revit_extract_api.py tests/test_revit_real_model.py -q
      - name: Independent EPANET 2.2 rerun on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'epanet22.zip'
          $solver = Join-Path $env:RUNNER_TEMP 'epanet22'
          Invoke-WebRequest 'https://github.com/OpenWaterAnalytics/EPANET/releases/download/v2.2/EPANET_2_2_WIN_32_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'E3C761CBD08B9F518C25639261304E9088834DD262092CFF421D37C3AB6EB8E2') { throw 'EPANET release checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $solver
          $env:EPANET_LIBRARY = Join-Path $solver '64bit/epanet2.dll'
          python -m pytest tests/test_engineering_validation.py tests/test_general_solver.py tests/test_general_solver_ui.py -q
      - name: Model, drawing and network-preview checks
        run: python -m pytest tests/test_model_intake.py tests/test_model_ui.py tests/test_drawing_uploads.py tests/test_network_preview.py -q
      - name: Verification limits
        shell: bash
        run: echo "Full-suite checks require local workbooks. Supported tree-network checks are covered by synthetic benchmarks. Live CAD/IFC/Revit ingestion is not certified." >> "$GITHUB_STEP_SUMMARY"
